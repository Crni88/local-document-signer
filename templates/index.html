<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Sign | Local Document Signer</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</head>
<body>
  <header class="app-header">
    <div class="brand"><span class="icon brand-mark" aria-hidden="true">draw</span><h1>Sign</h1></div>
    <div class="header-actions">
      <span class="local-status"><span class="icon" aria-hidden="true">lock</span>Local session</span>
      <button id="open-file" class="secondary"><span class="icon" aria-hidden="true">upload_file</span>Choose document</button>
      <button id="theme" class="icon-button" aria-label="Theme: system" title="Theme: system"><span class="icon" aria-hidden="true">desktop_windows</span></button>
    </div>
    <input id="file-input" type="file" accept=".pdf,.docx,.png,.jpg,.jpeg,.tif,.tiff,.bmp,.webp" hidden>
  </header>

  <div id="error" class="error-banner" role="alert" hidden>
    <span class="icon" aria-hidden="true">error</span><span id="error-message"></span>
    <button id="dismiss-error" class="icon-button" aria-label="Dismiss error" title="Dismiss error"><span class="icon" aria-hidden="true">close</span></button>
  </div>

  <main class="workspace">
    <aside class="sidebar" aria-label="Signature settings">
      <h2>Signature</h2>
      <div class="field name-field">
        <label for="signer-name">Full name</label>
        <input id="signer-name" type="text" maxlength="120" placeholder="Full name" autocomplete="off" dir="auto">
      </div>
      <div class="signature-display" aria-label="Signature preview" aria-busy="false">
        <span id="signature-placeholder" class="icon" aria-hidden="true">gesture</span>
        <img id="signature-preview" alt="" hidden>
      </div>
      <fieldset class="field style-field">
        <legend>Style</legend>
        <div class="segmented" id="signature-style" role="group" aria-label="Signature style">
          <button data-style="handwritten" aria-pressed="true">Script</button>
          <button data-style="classic" aria-pressed="false">Classic</button>
          <button data-style="plain" aria-pressed="false">Plain</button>
        </div>
      </fieldset>
      <fieldset class="field color-field">
        <legend>Ink</legend>
        <div class="swatches" role="group" aria-label="Ink color">
          <button class="swatch black" data-color="black" aria-label="Black ink" aria-pressed="true" title="Black ink"></button>
          <button class="swatch blue" data-color="blue" aria-label="Blue ink" aria-pressed="false" title="Blue ink"></button>
        </div>
      </fieldset>
      <div class="field width-field">
        <div class="label-row"><label for="signature-width">Width</label><output id="width-value" for="signature-width">28%</output></div>
        <input id="signature-width" type="range" min="1" max="95" value="28" step="1">
      </div>
      <div class="export-area">
        <div class="export-summary"><span>Placed signatures</span><strong id="signature-count">0</strong></div>
        <button id="download" class="primary" disabled><span class="icon" aria-hidden="true">download</span><span id="download-label">Download signed PDF</span></button>
      </div>
    </aside>

    <section class="document-pane" aria-label="Document editor">
      <div class="document-heading">
        <div class="document-title"><span class="icon" aria-hidden="true">description</span><span id="document-name">No document selected</span></div>
        <span id="document-size" class="muted"></span>
      </div>
      <div class="document-toolbar" aria-label="Document tools">
        <div class="toolbar-group">
          <button id="previous-page" class="icon-button" aria-label="Previous page" title="Previous page" disabled><span class="icon" aria-hidden="true">chevron_left</span></button>
          <label for="page-number" class="sr-only">Page number</label><input id="page-number" type="number" min="1" value="1" disabled>
          <span class="page-total">/ <span id="page-total">0</span></span>
          <button id="next-page" class="icon-button" aria-label="Next page" title="Next page" disabled><span class="icon" aria-hidden="true">chevron_right</span></button>
        </div>
        <div class="toolbar-group editing-tools">
          <button id="place-signature" class="icon-button" aria-label="Place signature" title="Place signature" aria-pressed="false" disabled><span class="icon" aria-hidden="true">draw</span></button>
          <button id="undo" class="icon-button" aria-label="Undo placement change" title="Undo placement change" disabled><span class="icon" aria-hidden="true">undo</span></button>
          <button id="delete-signature" class="icon-button" aria-label="Delete selected signature" title="Delete selected signature" disabled><span class="icon" aria-hidden="true">delete</span></button>
        </div>
        <div class="toolbar-group zoom-tools">
          <button id="zoom-out" class="icon-button" aria-label="Zoom out" title="Zoom out" disabled><span class="icon" aria-hidden="true">remove</span></button>
          <output id="zoom-value">100%</output>
          <button id="zoom-in" class="icon-button" aria-label="Zoom in" title="Zoom in" disabled><span class="icon" aria-hidden="true">add</span></button>
          <button id="fit-page" class="icon-button" aria-label="Fit page width" title="Fit page width" disabled><span class="icon" aria-hidden="true">fit_screen</span></button>
        </div>
      </div>

      <div id="document-viewport" class="document-viewport">
        <div id="empty-state" class="empty-state">
          <span class="icon empty-icon" aria-hidden="true">contract_edit</span>
          <h2>Document</h2>
          <button id="open-initial" class="primary"><span class="icon" aria-hidden="true">upload_file</span>Choose document</button>
          <p>PDF, DOCX, PNG, JPG, TIFF, BMP, WEBP</p>
          <span class="muted">25 MB max</span>
        </div>
        <div id="page-stage" class="page-stage" hidden>
          <div id="page-sheet" class="page-sheet" tabindex="0" aria-label="Document page" aria-busy="false">
            <img id="page-image" alt="Document page" draggable="false">
            <div id="placements" class="placements"></div>
          </div>
        </div>
      </div>
      <footer class="document-footer"><span id="status" role="status" aria-live="polite">No document</span><span>Visible signature</span></footer>
    </section>
  </main>
</body>
</html>
